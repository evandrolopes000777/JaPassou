<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | JáPassou?</title>

    <!-- Favicon (arquivo já existente no projeto) -->
    <link rel="icon" type="image/png" href="assets/icon/favicon-provisoria.png">

    <!-- Fonte Ubuntu (a mesma da referência visual) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do projeto: globais -> componentes -> específico do login (por último) -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/componentes.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-pagina d-flex align-items-center justify-content-center min-vh-100 p-3">

    <main class="login-painel w-100 d-flex flex-column justify-content-center">

        <header class="text-center">
            <h1 class="login-logo m-0" id="login-titulo">
                <span class="login-logo__ja">Já</span><span class="login-logo__nome">Passou?</span>
            </h1>
        </header>

        <form class="login-form" action="home.html" method="get" aria-labelledby="login-titulo">

            <div class="mb-3">
                <label for="email" class="form-label login-label">E-mail</label>
                <input
                    type="email"
                    class="form-control login-campo"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label login-label">Senha</label>
                <input
                    type="password"
                    class="form-control login-campo"
                    id="senha"
                    name="senha"
                    placeholder="********"
                    autocomplete="current-password"
                    required>
            </div>

            <p class="login-esqueci text-center">
                <a href="#" class="login-link">Esqueci Minha Senha</a>
            </p>

            <div class="d-grid gap-3">
                <button type="submit" class="btn login-botao login-botao--principal">Entrar</button>
                <a href="cadastro.html" class="btn login-botao login-botao--secundario">Criar Conta</a>
            </div>

        </form>

    </main>

</body>
</html>
