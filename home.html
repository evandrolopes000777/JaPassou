<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="shortcut icon" href="assets/icon/favicon-provisoria.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/componentes.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>
    <main>
        <img src="assets/icon/SVGs/logo-fundo-amarelo.svg" alt="logo ja passou?" class="logo">
        <h1>Oi, aluno!</h1>
        <h2>IFBA - Campus Irecê</h2>

        <div class="card">
            <div class="card-header">
                <p class="status">Em circulação</p>
                <h2 class="rota-nome">Rota Centro</h2>
            </div>

            <div class="estimativa-container">
                <div class="coluna-info">
                    <p class="label-pequena">ESTIMATIVA</p>
                    <h1 class="valor-tempo">10 MIN</h1>
                </div>
                <div class="coluna-info">
                    <p class="label-pequena">ATÉ</p>
                    <p class="valor-destino">Ponto Ayrton Senna</p>
                </div>
            </div>

            <div class="seletor-presenca-custom">
                <input type="radio" name="presenca" id="vou-hoje" checked>
                <label class="opcao-btn ativa-amarela" for="vou-hoje">Vou Hoje</label>

                <input type="radio" name="presenca" id="nao-vou">
                <label class="opcao-btn" for="nao-vou">Não Vou</label>
            </div>

            <p class="texto-aviso">
                Você pode mudar até a saída do ônibus (12:10).
            </p>

            <div class="rodape">
                <button class="botao ver-no-mapa">Ver No Mapa</button>
                <button class="botao alterar">Alterar Só Hoje</button>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </main>
</body>

</html>
