<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | JáPassou?</title>

    <!-- Favicon (arquivo já existente no projeto) -->
    <link rel="icon" type="image/png" href="assets/icon/favicon-provisoria.png">

    <!-- Fonte Ubuntu (a mesma do login) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do projeto: globais -> componentes -> específico do cadastro (por último) -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/componentes.css">
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>
<body class="cadastro-pagina d-flex align-items-center justify-content-center min-vh-100 p-3">

    <main class="cadastro-painel w-100">

        <header>
            <a href="login.html" class="cadastro-voltar" aria-label="Voltar para o login">
                <img src="assets/icon/SVGs/voltar.svg" alt="" width="24" height="24">
            </a>
            <h1 class="cadastro-titulo" id="cadastro-titulo">Criar Conta</h1>
        </header>

        <form class="cadastro-form" action="login.html" method="get" aria-labelledby="cadastro-titulo">

            <div class="mb-3">
                <label for="nome" class="form-label cadastro-label">Nome Completo</label>
                <input
                    type="text"
                    class="form-control cadastro-campo"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    required>
            </div>

            <div class="mb-3">
                <label for="nascimento" class="form-label cadastro-label">Data de Nascimento</label>
                <input
                    type="date"
                    class="form-control cadastro-campo cadastro-campo--data"
                    id="nascimento"
                    name="nascimento"
                    autocomplete="bday"
                    required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label cadastro-label">E-Mail</label>
                <input
                    type="email"
                    class="form-control cadastro-campo"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label cadastro-label">Senha</label>
                <input
                    type="password"
                    class="form-control cadastro-campo"
                    id="senha"
                    name="senha"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="mb-3">
                <label for="confirmar-senha" class="form-label cadastro-label">Confirme sua senha</label>
                <input
                    type="password"
                    class="form-control cadastro-campo"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="mb-4">
                <label for="instituicao" class="form-label cadastro-label">Instituição de ensino</label>
                <select
                    class="form-select cadastro-campo cadastro-campo--select"
                    id="instituicao"
                    name="instituicao"
                    required>
                    <option value="ifba-irece" selected>IFBA - CAMPUS IRECÊ</option>
                </select>
            </div>

            <div class="cadastro-termos d-flex align-items-start gap-3 mb-4">
                <input
                    type="checkbox"
                    class="form-check-input cadastro-checkbox flex-shrink-0 m-0"
                    id="termos"
                    name="termos"
                    required>
                <label for="termos" class="form-check-label cadastro-termos__texto">
                    Li e aceito os Termos de uso e a Política de privacidade, inclusive o uso dos meus dados de localização e de comparecimento.
                </label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn cadastro-botao">Criar Conta</button>
            </div>

        </form>

        <footer class="cadastro-rodape text-center">
            <p class="m-0">
                Já tenho conta <span aria-hidden="true">*</span>
                <a href="login.html" class="cadastro-link">Entrar</a>
            </p>
        </footer>

    </main>

</body>
</html>
