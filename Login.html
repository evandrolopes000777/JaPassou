<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body class="login">

    <header>

    </header>

    <main>
        <div class="d-flex justify-content-center align-items-center logo mb-5">
            <img src="assets/images/logo-cor-pequena.png" class="img-fluid" alt="Logo onibus já passou?">
        </div>

        <form action="usuarioAluno.html">
            <div class="row justify-content-center">
                <div class="mb-5 col-10">
                    <input type="email" class="form-control" id="e-mail" placeholder="E-mail" required>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="mb-5 col-10">
                    <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                </div>
            </div>

            <div class="container d-flex justify-content-center">
                <button type="submit" class="btn btn-primary botaoLogin">LOGIN</button>
            </div>

        </form>

    </main>

    <footer>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
